services:
  admin-panel:
    build:
      context: .
      args:
        NEXT_PUBLIC_IAM_API: https://iam.smana.web.id/v1
    container_name: admin-panel
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - admin_network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: admin_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - admin-panel
    networks:
      - admin_network

networks:
  admin_network:
    name: admin_network
